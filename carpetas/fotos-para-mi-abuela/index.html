<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#21112e"><title>Fotos para mi abuela · Kenai 360</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;background:radial-gradient(ellipse at top,#3b2850,#090711 68%);color:#fff;font-family:system-ui,Arial,sans-serif}.card{width:min(1200px,100%);margin:4vh auto;padding:clamp(18px,3vw,30px);border:1px solid #d9a7ff66;border-radius:22px;background:#171020ed;box-shadow:0 18px 70px #0009}p{color:#d8cce2;line-height:1.5}label{display:block;margin:20px 0 8px;font-weight:700}input{width:100%;max-width:500px;padding:13px;border:1px solid #ffffff55;border-radius:12px;background:#090711;color:white;font:inherit}button{padding:13px 22px;margin-top:14px;border:0;border-radius:999px;background:#d9a7ff;color:#21112e;font-weight:800;cursor:pointer}#msg{min-height:24px;color:#ffcf9b;margin-top:12px}.back{display:inline-block;margin-top:18px;color:#dfc2ff}iframe{display:block;width:100%;height:78vh;min-height:520px;border:1px solid #d9a7ff66;border-radius:16px;background:#030711}@media(max-width:650px){iframe{height:72vh;min-height:460px}}#gallery{position:fixed;inset:0;z-index:9999;width:100vw;height:100dvh;margin:0;padding:0;background:#030711}#gallery h2,#gallery p{display:none!important}#gallery iframe{position:absolute;inset:0;width:100vw!important;height:100dvh!important;min-height:0!important;border:0!important;border-radius:0!important}body:has(#gallery:not([hidden])){padding:0!important;overflow:hidden}body:has(#gallery:not([hidden])) .card{width:100vw!important;max-width:none!important;height:100dvh!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important}body:has(#gallery:not([hidden])) .card>h1,body:has(#gallery:not([hidden])) .card>p,body:has(#gallery:not([hidden])) .card>#gate,body:has(#gallery:not([hidden])) .card>#msg,body:has(#gallery:not([hidden])) .card>.back{display:none!important}</style></head><body><main class="card"><h1>📷 Fotos para mi abuela</h1><p>Introduce la contraseña para entrar en esta carpeta.</p><form id="gate"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" required><br><button type="submit">Entrar</button></form><div id="msg" role="status" aria-live="polite"></div><section id="gallery" hidden><h2>💜 ¡Bienvenida!</h2><p>Explora las fotografías con el visor 360°, usa los controles y prueba los efectos.</p><iframe title="Visor 360 Fotos para mi abuela" src="./visor/"></iframe></section><a class="back" href="../">← Volver a Carpetas</a></main><script>document.getElementById('gate').addEventListener('submit',e=>{e.preventDefault();if(document.getElementById('pw').value==='xd1234'){e.currentTarget.hidden=true;document.getElementById('gallery').hidden=false;document.getElementById('msg').textContent=''}else{document.getElementById('msg').textContent='Contraseña incorrecta. Vuelve a intentarlo.'}});</script></body></html>
