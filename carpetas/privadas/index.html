<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050705">
<title>Privadas · Kenai 360</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at top,#1b2a16,#050705 65%);color:#fff;font-family:system-ui,Segoe UI,Arial,sans-serif}.panel{width:min(1200px,96vw);padding:28px;border:1px solid #a4f43b66;border-radius:22px;background:#101810eF;box-shadow:0 18px 70px #0009}h1{margin:0 0 8px;font-size:1.55rem}p{color:#c8d0c3;line-height:1.5}label{display:block;margin:22px 0 8px;font-weight:700}input{width:100%;padding:14px;border:1px solid #ffffff45;border-radius:12px;background:#050905;color:#fff;font:inherit}button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:999px;background:#a4f43b;color:#101810;font-weight:900;font-size:1rem;cursor:pointer}#message{min-height:24px;margin-top:14px;color:#ffd18a}.back{display:inline-block;margin-top:18px;color:#b9f77b}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:18px}.photo{margin:0;padding:8px;border:1px solid #a4f43b55;border-radius:14px;background:#080d08}.photo img{display:block;width:100%;height:auto;max-height:65vh;object-fit:contain;border-radius:9px}.photo a{display:block;margin-top:8px;color:#b9f77b;overflow-wrap:anywhere}.empty{color:#c8d0c3}
#inside{position:fixed!important;inset:0!important;z-index:9999!important;width:100vw!important;height:100dvh!important;margin:0!important;padding:0!important;background:#030711!important}#inside h2,#inside p{display:none!important}#inside iframe{position:absolute;inset:0;width:100vw!important;height:100dvh!important;border:0!important;border-radius:0!important}body:has(#inside:not([hidden])){padding:0!important}body:has(#inside:not([hidden])) .panel{width:100vw!important;max-width:none!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important}body:has(#inside:not([hidden])) .panel>h1,body:has(#inside:not([hidden])) .panel>p,body:has(#inside:not([hidden])) .panel>form,body:has(#inside:not([hidden])) .panel>#message,body:has(#inside:not([hidden])) .panel>.back{display:none!important}</style>
</head>
<body>
<main class="panel">
<h1>🔒 Carpeta privada</h1>
<p>Introduce la contraseña para acceder al espacio privado de Kenai 360.</p>
<form id="unlock">
<label for="password">Contraseña</label>
<input id="password" type="password" autocomplete="current-password" required autofocus>
<button type="submit">Desbloquear carpeta</button>
</form>
<div id="message" role="status" aria-live="polite"></div>
<section id="inside" hidden style="width:min(1200px,96vw);height:min(82vh,900px);margin-top:16px"><h2>Acceso autorizado</h2><p>Visor Kenai 360 privado.</p><iframe title="Visor privado Kenai 360" src="./visor/" allow="xr-spatial-tracking; fullscreen; accelerometer; gyroscope" allowfullscreen style="display:block;width:100%;height:70vh;border:1px solid #a4f43b66;border-radius:16px;background:#030711"></iframe></section>
<a class="back" href="../../">← Volver a Kenai 360</a>
</main>
<script>
const CONFIG={
 salt:"Z3duvU2QNImEZTcZ1gGxDA==",
 iv:"dSAPJwCrKTWecpgO",
 verifier:"gt1vuPcTWVXJKLFMs2WwFxl228LJWGJzXd4P+PDySgBkTkI4OediBf0L",
 iterations:310000
};
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById("unlock").addEventListener("submit",async event=>{
 event.preventDefault();
 const message=document.getElementById("message");
 const button=event.currentTarget.querySelector("button");
 button.disabled=true;message.textContent="Comprobando…";
 try{
  const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(document.getElementById("password").value),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:fromB64(CONFIG.salt),iterations:CONFIG.iterations,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:fromB64(CONFIG.iv),additionalData:new TextEncoder().encode("kenai360-private-folder-v1")},key,fromB64(CONFIG.verifier));
  if(new TextDecoder().decode(plain)!=="KENAI360_PRIVATE_FOLDER_OK")throw new Error("bad password");
  document.getElementById("unlock").hidden=true;
  document.getElementById("inside").hidden=false;
  message.textContent="";

 }catch(error){message.textContent="Contraseña incorrecta. Inténtalo de nuevo."}
 finally{button.disabled=false}
});
</script>
</body>
</html>
