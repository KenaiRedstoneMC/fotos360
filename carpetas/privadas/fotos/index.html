<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fotos para mi abuela · Kenai 360</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#3b2850,#090711 68%);color:#fff;font-family:system-ui,Arial,sans-serif}.card{width:min(430px,100%);padding:28px;border:1px solid #d9a7ff66;border-radius:22px;background:#171020ed}p{color:#d8cce2;line-height:1.5}label{display:block;margin:20px 0 8px;font-weight:700}input{width:100%;padding:13px;border:1px solid #ffffff55;border-radius:12px;background:#090711;color:white;font:inherit}button{width:100%;padding:13px;margin-top:14px;border:0;border-radius:999px;background:#d9a7ff;color:#21112e;font-weight:800;cursor:pointer}#msg{min-height:24px;color:#ffcf9b;margin-top:12px}.back{display:inline-block;margin-top:18px;color:#dfc2ff}</style></head><body><main class="card"><h1>📷 Fotos para mi abuela</h1><p>Introduce la contraseña para entrar en esta carpeta.</p><form id="gate"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="off" required><button>Entrar</button></form><div id="msg" role="status"></div><section id="gallery" hidden><h2>💜 ¡Bienvenida!</h2><p>Esta carpeta está preparada para tus fotografías.</p></section><a class="back" href="../">← Volver a Privadas</a></main><script>/* Comprobación visual: no protege archivos alojados en un repositorio público. */document.getElementById('gate').addEventListener('submit',e=>{e.preventDefault();if(document.getElementById('pw').value==='xd1234'){e.currentTarget.hidden=true;document.getElementById('gallery').hidden=false;document.getElementById('msg').textContent=''}else{document.getElementById('msg').textContent='Contraseña incorrecta. Vuelve a intentarlo.'}});</script></body></html>
