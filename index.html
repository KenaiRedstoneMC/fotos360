<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050705">
<title>Kenai 360 Player</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050705;color:#fff;font-family:system-ui,Segoe UI,Arial,sans-serif}
#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.top{position:fixed;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 18px 14px;background:linear-gradient(#000a,transparent);pointer-events:none}
.brand{font-weight:900;letter-spacing:.12em;font-size:.9rem;text-shadow:0 2px 8px #000}.brand span{color:#a4f43b}
.actions{display:flex;gap:8px;pointer-events:auto}button{border:1px solid #ffffff40;background:#101810d9;color:#fff;border-radius:999px;padding:10px 15px;font-weight:700;cursor:pointer;backdrop-filter:blur(10px)}button:hover,select:hover{border-color:#a4f43b;color:#a4f43b}button:disabled{opacity:.4;cursor:default}select{max-width:180px;border:1px solid #ffffff40;background:#101810d9;color:#fff;border-radius:999px;padding:9px 12px;font-weight:700}
#file{display:none}
#welcome{position:fixed;z-index:4;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(ellipse at center,#19291a,#050705 70%)}
.content{max-width:440px}.logo{font-size:clamp(2.4rem,9vw,4.5rem);font-weight:950;letter-spacing:-.07em;margin:0 0 8px}.logo span{color:#a4f43b}
p{color:#c0c9c0;line-height:1.6;margin:0 0 22px}#choose{background:#a4f43b;color:#10170a;border:0;padding:13px 22px}
#galleryPanel{position:fixed;z-index:6;left:0;right:0;bottom:0;height:126px;overflow-x:auto;overflow-y:hidden;padding:12px 14px max(12px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#050705 18%,#050705f2);display:none}#galleryPanel.visible{display:block}#galleryGrid{display:flex;gap:10px;width:max-content;min-width:100%;align-items:center}.photoCard{flex:0 0 132px;width:132px;border:1px solid #ffffff35;background:#101810;border-radius:9px;overflow:hidden;color:#fff;text-align:left;padding:0;cursor:pointer}.photoCard:hover{border-color:#a4f43b}.photoCard img{display:block;width:100%;height:72px;object-fit:cover}.photoCard span{display:block;padding:6px 7px;font-size:.7rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.emptyGallery{color:#c0c9c0;text-align:center;padding:12px;font-size:.85rem}#status{position:fixed;z-index:5;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:calc(100% - 28px);padding:8px 14px;border-radius:999px;background:#0009;color:#e1e9df;font-size:.8rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.hidden{display:none!important}
@media(max-width:600px){.top{padding-left:10px;padding-right:10px}.brand{font-size:.68rem}.actions{gap:4px}button{padding:8px 9px;font-size:.7rem}#status{font-size:.68rem}#galleryPanel{height:112px}.photoCard{flex-basis:112px;width:112px}.photoCard img{height:62px}}
#vrButton{position:fixed!important;z-index:12!important;left:50%!important;right:auto!important;bottom:max(18px,env(safe-area-inset-bottom))!important;top:auto!important;transform:translateX(-50%);border:1px solid #a4f43b!important;border-radius:999px!important;background:#101810ed!important;color:#fff!important;padding:11px 20px!important;font:700 13px system-ui,Arial!important;letter-spacing:.04em;cursor:pointer}body:has(#vrButton){--vr-ready:1}
</style>
</head>
<body>
<div id="stage"></div>
<div id="welcome"><div class="content"><div class="logo">KENAI<span>360</span></div><p>Esfera 3D 360° real.<br>Abre una fotografía panorámica de tu GoPro MAX y mira alrededor desde el interior de la esfera.</p><button id="choose">＋ Abrir fotografía 360°</button></div></div>
<div class="top"><div class="brand">KENAI_<span>360 PLAYER</span></div><div class="actions"><button id="toggleGallery">Galería</button><select id="gallery" aria-label="Fotos guardadas" title="Fotos guardadas" hidden><option>Fotos guardadas</option></select><button id="open">Abrir foto</button><button id="reset" disabled>Recentrar</button><button id="full" disabled>⛶</button></div></div>
<input id="file" type="file" accept=".jpg,.jpeg,image/jpeg">
<section id="galleryPanel" class="visible" aria-label="Galería de fotografías"><div id="galleryGrid"></div></section><div id="status">Arrastra para mirar · Pellizca o usa la rueda para zoom</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const stage=document.getElementById('stage'),input=document.getElementById('file'),gallery=document.getElementById('gallery');
const galleryPanel=document.getElementById('galleryPanel'),galleryGrid=document.getElementById('galleryGrid');
const welcome=document.getElementById('welcome'),status=document.getElementById('status');
const reset=document.getElementById('reset'),full=document.getElementById('full');
let renderer,scene,camera,controls,sphere,texture,objectUrl=null,loaded=false;
function init(){
 try {
 scene=new THREE.Scene();scene.background=new THREE.Color(0x050705);
 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1100);
 camera.position.set(0,0,0.01);
 renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,preserveDrawingBuffer:false,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2.5));renderer.setSize(innerWidth,innerHeight);
 renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.xr.enabled=true;stage.appendChild(renderer.domElement);
 const vrButton=document.createElement('button');vrButton.id='vrButton';vrButton.textContent='🥽 ENTER VR';document.body.appendChild(vrButton);
 vrButton.addEventListener('click',async()=>{try{if(!navigator.xr){status.textContent='Este navegador no ofrece WebXR';return;}const supported=await navigator.xr.isSessionSupported('immersive-vr');if(!supported){status.textContent='Este dispositivo/navegador no admite VR inmersiva';return;}const session=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']});await renderer.xr.setSession(session);}catch(error){console.error(error);status.textContent='No se pudo iniciar VR: '+(error.message||error);}});
 renderer.xr.addEventListener('sessionstart',()=>{controls.enabled=false;status.textContent='Modo VR activado · mueve la cabeza para mirar'});
 renderer.xr.addEventListener('sessionend',()=>{controls.enabled=true;status.textContent='Modo normal · arrastra para mirar'});
 controls=new OrbitControls(camera,renderer.domElement);
 controls.enablePan=false;controls.enableDamping=true;controls.dampingFactor=.06;
 controls.rotateSpeed=-.35;controls.zoomSpeed=.8;controls.minDistance=.01;controls.maxDistance=.01;
 controls.enableZoom=false;controls.enablePan=false;
 window.addEventListener('resize',resize);
 animate();
 } catch(error) { console.error(error); status.textContent='Error al iniciar el visor 3D: '+(error.message||error); }
}
function resize(){if(!camera||!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
window.addEventListener('wheel',e=>{if(!loaded)return;camera.fov=Math.max(35,Math.min(100,camera.fov+e.deltaY*.035));camera.updateProjectionMatrix()},{passive:true});
function animate(){renderer.setAnimationLoop(()=>{if(controls)controls.update();if(renderer&&scene&&camera)renderer.render(scene,camera)})}
function openPicker(){input.click()}
document.getElementById('choose').addEventListener('click',openPicker);
document.getElementById('open').addEventListener('click',openPicker);
document.getElementById('reset').addEventListener('click',()=>{
 if(controls){controls.reset();camera.position.set(0,0,.01);controls.target.set(0,0,0);controls.update()}
});
full.addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()});
function loadImage(source,name){
 status.textContent='Cargando '+name+' en la esfera 3D…';
 if(!renderer||!scene||!camera){status.textContent='El visor 3D no se ha iniciado. Recarga la página.';return;}
 const loader=new THREE.TextureLoader();
 loader.load(source,(loadedTexture)=>{
  if(texture)texture.dispose();texture=loadedTexture;
  texture.colorSpace=THREE.SRGBColorSpace;
  texture.mapping=THREE.UVMapping;
  texture.generateMipmaps=true;
  texture.minFilter=THREE.LinearMipmapLinearFilter;
  texture.magFilter=THREE.LinearFilter;
  texture.anisotropy=renderer.capabilities.getMaxAnisotropy();
  if(sphere){scene.remove(sphere);sphere.geometry.dispose();sphere.material.dispose()}
  // Adaptar la esfera al formato real de cada JPG. Un 2:1 cubre 360° x 180°;
  // formatos más anchos (por ejemplo 3:1) cubren menos ángulo vertical.
  const aspect=loadedTexture.image.width/loadedTexture.image.height;
  const verticalAngle=Math.min(Math.PI,Math.PI*2/aspect);
  const thetaStart=(Math.PI-verticalAngle)/2;
  const geometry=new THREE.SphereGeometry(500,160,96,0,Math.PI*2,thetaStart,verticalAngle);
  geometry.scale(-1,1,1);
  const material=new THREE.MeshBasicMaterial({map:texture,side:THREE.FrontSide,toneMapped:false});
  sphere=new THREE.Mesh(geometry,material);scene.add(sphere);
  controls.target.set(0,0,0);camera.position.set(0,0,.01);camera.fov=75;camera.updateProjectionMatrix();controls.update();
  loaded=true;welcome.classList.add('hidden');galleryPanel.classList.remove('visible');reset.disabled=false;full.disabled=false;
  status.textContent=name+' · Panorama 360° · formato '+loadedTexture.image.width+'×'+loadedTexture.image.height;
 },undefined,(err)=>{console.error('Fallo cargando imagen:',source,err);status.textContent='No se pudo cargar '+name+'. Comprueba que el JPG existe y que hay conexión.'});
}
input.addEventListener('change',()=>{
 const file=input.files?.[0];if(!file)return;
 if(objectUrl)URL.revokeObjectURL(objectUrl);
 objectUrl=URL.createObjectURL(file);
 loadImage(objectUrl,file.name);
});
window.loadStored360=(file)=>loadImage('./fotos/'+file,file.split('/').pop());

init();
</script>
<script>
(()=>{const files=["GP__0077.JPG","GS__0015.JPG","GS__0016.JPG","GS__0017.JPG","GS__0021.JPG","GS__0023.JPG","GS__0026.JPG","GS__0038.JPG","GS__0039.JPG","GS__0045.JPG","GS__0068.JPG","GS__0070.JPG","GS__0081.JPG","GS__0082.JPG","GS__0083.JPG","GS__0084.JPG","GS__0085.JPG","GS__0086.JPG","GS__0087.JPG","GS__0088.JPG","GS__0089.JPG","GS__0090.JPG","GS__0091.JPG","GS__0092.JPG","GS__0093.JPG","GS__0094.JPG","GS__0095.JPG","GS__0105.JPG"];const panel=document.getElementById('galleryPanel'),grid=document.getElementById('galleryGrid'),select=document.getElementById('gallery'),status=document.getElementById('status');document.getElementById('toggleGallery').addEventListener('click',()=>panel.classList.toggle('visible'));select.hidden=false;select.innerHTML='<option value="">Elegir foto ('+files.length+')</option>';for(const file of files){const option=document.createElement('option');option.value=file;option.textContent=file;select.appendChild(option);const card=document.createElement('button');card.className='photoCard';card.type='button';const img=document.createElement('img');img.src='https://raw.githubusercontent.com/KenaiRedstoneMC/fotos360/main/fotos/'+encodeURIComponent(file);img.alt=file;img.loading='lazy';const caption=document.createElement('span');caption.textContent=file;card.append(img,caption);card.addEventListener('click',()=>{if(window.loadStored360)window.loadStored360(file);else status.textContent='El visor 360 está cargando…'});grid.appendChild(card);}select.addEventListener('change',()=>{if(select.value&&window.loadStored360)window.loadStored360(select.value)});status.textContent=files.length+' fotografías · Pulsa una para verla en 360°';})();
</script>
</body>
</html>
