<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050705">
<title>Kenai 360 Player</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<style>
:root{color-scheme:dark;--green:#a4f43b;--glass:rgba(10,15,11,.78)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050705;color:#fff;font-family:system-ui,Segoe UI,Arial,sans-serif}
#panorama{position:fixed;inset:0;width:100%;height:100%;height:100dvh;background:#050705}
.pnlm-container{background:#050705}
.topbar{position:fixed;z-index:20;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding: max(14px,env(safe-area-inset-top)) 18px 14px;background:linear-gradient(180deg,rgba(0,0,0,.75),transparent);pointer-events:none}
.brand{font-weight:850;letter-spacing:.12em;font-size:.9rem;text-shadow:0 2px 8px #000}
.brand span{color:var(--green)}
.actions{display:flex;gap:8px;pointer-events:auto}
button{border:1px solid #ffffff35;background:var(--glass);backdrop-filter:blur(12px);color:white;border-radius:999px;padding:10px 15px;font-weight:700;cursor:pointer}
button:hover{border-color:var(--green);color:var(--green)}
#file{display:none}
#empty{position:fixed;z-index:10;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(ellipse at center,#18251a,#050705 68%)}
#empty .content{max-width:440px}
.logo{font-size:clamp(2rem,8vw,4rem);font-weight:900;letter-spacing:-.06em;margin:0 0 8px}
.logo span{color:var(--green)}
#empty p{color:#b6c0b6;line-height:1.6;margin:0 0 22px}
#choose{background:var(--green);color:#10170a;border:0;padding:13px 22px}
#status{position:fixed;z-index:20;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:calc(100% - 28px);padding:8px 14px;border-radius:999px;background:rgba(0,0,0,.58);color:#d9e2d8;font-size:.8rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.hidden{display:none!important}
.pnlm-controls{border-radius:12px;overflow:hidden}
@media(max-width:600px){.topbar{padding-left:12px;padding-right:12px}.brand{font-size:.75rem}.actions{gap:5px}button{padding:9px 11px;font-size:.78rem}#status{font-size:.72rem}}
</style>
</head>
<body>
<div id="panorama"></div>
<div id="empty">
 <div class="content">
  <div class="logo">KENAI<span>360</span></div>
  <p>Reproductor de fotografías 360°<br>Abre una foto JPG panorámica de tu GoPro MAX y explora todo a tu alrededor.</p>
  <button id="choose">＋ Abrir fotografía 360°</button>
 </div>
</div>
<div class="topbar">
 <div class="brand">KENAI_<span>360 PLAYER</span></div>
 <div class="actions">
  <button id="open">Abrir foto</button>
  <button id="reset" disabled>Recentrar</button>
  <button id="fullscreen" disabled>⛶</button>
 </div>
</div>
<input id="file" type="file" accept=".jpg,.jpeg,image/jpeg">
<div id="status">Arrastra para mirar · Rueda para zoom</div>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script>
const input=document.getElementById('file');
const status=document.getElementById('status');
const empty=document.getElementById('empty');
const reset=document.getElementById('reset');
const fullscreen=document.getElementById('fullscreen');
let viewer=null,objectUrl=null;
function pick(){input.click()}
document.getElementById('choose').addEventListener('click',pick);
document.getElementById('open').addEventListener('click',pick);
reset.addEventListener('click',()=>{if(viewer){viewer.setPitch(0);viewer.setYaw(0);viewer.setHfov(100)}});
fullscreen.addEventListener('click',()=>{
 const el=document.documentElement;
 if(!document.fullscreenElement){el.requestFullscreen?.()}else{document.exitFullscreen?.()}
});
input.addEventListener('change',()=>{
 const file=input.files?.[0];if(!file)return;
 if(objectUrl)URL.revokeObjectURL(objectUrl);
 objectUrl=URL.createObjectURL(file);
 if(viewer){viewer.destroy();viewer=null}
 empty.classList.add('hidden');
 reset.disabled=true;fullscreen.disabled=true;
 status.textContent='Cargando fotografía…';
 try{
  viewer=pannellum.viewer('panorama',{
   type:'equirectangular',panorama:objectUrl,autoLoad:true,
   autoRotate:0,showControls:true,showZoomCtrl:true,showFullscreenCtrl:false,
   compass:false,mouseZoom:true,draggable:true,keyboardZoom:true,
   hfov:100,minHfov:35,maxHfov:120,pitch:0,yaw:0,
   hotSpotDebug:false
  });
  viewer.on('load',()=>{
   status.textContent=file.name+' · 360°';
   reset.disabled=false;fullscreen.disabled=false;
  });
  viewer.on('error',()=>{
   status.textContent='No se pudo interpretar esta foto como panorámica 360°.';
   empty.classList.remove('hidden');
  });
 }catch(e){
  status.textContent='No se pudo abrir la imagen.';
  empty.classList.remove('hidden');
 }
});
window.addEventListener('beforeunload',()=>{if(objectUrl)URL.revokeObjectURL(objectUrl)});
</script>
</body>
</html>
