<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050705">
<title>Kenai 360 Player</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050705;color:#fff;font-family:system-ui,Segoe UI,Arial,sans-serif}
#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.top{position:fixed;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 18px 14px;background:linear-gradient(#000a,transparent);pointer-events:none}
.brand{font-weight:900;letter-spacing:.12em;font-size:.9rem;text-shadow:0 2px 8px #000}.brand span{color:#a4f43b}
.actions{display:flex;gap:8px;pointer-events:auto}button{border:1px solid #ffffff40;background:#101810d9;color:#fff;border-radius:999px;padding:10px 15px;font-weight:700;cursor:pointer;backdrop-filter:blur(10px)}button:hover,select:hover{border-color:#a4f43b;color:#a4f43b}button:disabled{opacity:.4;cursor:default}select{max-width:180px;border:1px solid #ffffff40;background:#101810d9;color:#fff;border-radius:999px;padding:9px 12px;font-weight:700}
#file{display:none}
#welcome{position:fixed;z-index:4;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(ellipse at center,#19291a,#050705 70%)}
.content{max-width:440px}.logo{font-size:clamp(2.4rem,9vw,4.5rem);font-weight:950;letter-spacing:-.07em;margin:0 0 8px}.logo span{color:#a4f43b}
p{color:#c0c9c0;line-height:1.6;margin:0 0 22px}#choose{background:#a4f43b;color:#10170a;border:0;padding:13px 22px}
#galleryPanel{position:fixed;z-index:6;left:0;right:0;bottom:54px;max-height:38vh;overflow:auto;padding:12px 16px;background:linear-gradient(transparent,#050705 12%);display:none}#galleryPanel.visible{display:block}#galleryGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:12px;max-width:1100px;margin:auto}.photoCard{border:1px solid #ffffff30;background:#101810;border-radius:12px;overflow:hidden;color:#fff;text-align:left;padding:0;cursor:pointer}.photoCard img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}.photoCard span{display:block;padding:8px;font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.emptyGallery{color:#c0c9c0;text-align:center;padding:12px;font-size:.85rem}#status{position:fixed;z-index:5;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:calc(100% - 28px);padding:8px 14px;border-radius:999px;background:#0009;color:#e1e9df;font-size:.8rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.hidden{display:none!important}
@media(max-width:600px){.top{padding-left:12px;padding-right:12px}.brand{font-size:.72rem}.actions{gap:5px}button{padding:9px 11px;font-size:.76rem}#status{font-size:.7rem}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="welcome"><div class="content"><div class="logo">KENAI<span>360</span></div><p>Esfera 3D 360° real.<br>Abre una fotografía panorámica de tu GoPro MAX y mira alrededor desde el interior de la esfera.</p><button id="choose">＋ Abrir fotografía 360°</button></div></div>
<div class="top"><div class="brand">KENAI_<span>360 PLAYER</span></div><div class="actions"><select id="gallery" aria-label="Fotos guardadas" title="Fotos guardadas" hidden><option>Fotos guardadas</option></select><button id="open">Abrir foto</button><button id="reset" disabled>Recentrar</button><button id="full" disabled>⛶</button></div></div>
<input id="file" type="file" accept=".jpg,.jpeg,image/jpeg">
<section id="galleryPanel" aria-label="Galería de fotografías"><div id="galleryGrid"></div></section><div id="status">Arrastra para mirar · Pellizca o usa la rueda para zoom</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const stage=document.getElementById('stage'),input=document.getElementById('file'),gallery=document.getElementById('gallery');
const galleryPanel=document.getElementById('galleryPanel'),galleryGrid=document.getElementById('galleryGrid');
const welcome=document.getElementById('welcome'),status=document.getElementById('status');
const reset=document.getElementById('reset'),full=document.getElementById('full');
let renderer,scene,camera,controls,sphere,texture,objectUrl=null,loaded=false;
function init(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x050705);
 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1100);
 camera.position.set(0,0,0.01);
 renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:false});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
 renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);
 controls=new OrbitControls(camera,renderer.domElement);
 controls.enablePan=false;controls.enableDamping=true;controls.dampingFactor=.06;
 controls.rotateSpeed=-.35;controls.zoomSpeed=.8;controls.minDistance=.01;controls.maxDistance=.01;
 controls.enableZoom=true;controls.enablePan=false;
 window.addEventListener('resize',resize);
 animate();
}
function resize(){if(!camera||!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function animate(){requestAnimationFrame(animate);if(controls)controls.update();if(renderer&&scene&&camera)renderer.render(scene,camera)}
function openPicker(){input.click()}
document.getElementById('choose').addEventListener('click',openPicker);
document.getElementById('open').addEventListener('click',openPicker);
document.getElementById('reset').addEventListener('click',()=>{
 if(controls){controls.reset();camera.position.set(0,0,.01);controls.target.set(0,0,0);controls.update()}
});
full.addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()});
function loadImage(source,name){
 status.textContent='Cargando '+name+' en la esfera 3D…';
 const loader=new THREE.TextureLoader();
 loader.load(source,(loadedTexture)=>{
  if(texture)texture.dispose();texture=loadedTexture;
  texture.colorSpace=THREE.SRGBColorSpace;
  texture.anisotropy=renderer.capabilities.getMaxAnisotropy();
  if(sphere){scene.remove(sphere);sphere.geometry.dispose();sphere.material.dispose()}
  const geometry=new THREE.SphereGeometry(500,96,64);
  geometry.scale(-1,1,1);
  const material=new THREE.MeshBasicMaterial({map:texture,side:THREE.BackSide});
  sphere=new THREE.Mesh(geometry,material);scene.add(sphere);
  controls.target.set(0,0,0);camera.position.set(0,0,.01);camera.fov=75;camera.updateProjectionMatrix();controls.update();
  loaded=true;welcome.classList.add('hidden');reset.disabled=false;full.disabled=false;
  status.textContent=name+' · Esfera 360° 3D';
 },undefined,(err)=>{console.error(err);status.textContent='No se pudo cargar '+name+'. Comprueba que sea un JPG 360°.'});
}
input.addEventListener('change',()=>{
 const file=input.files?.[0];if(!file)return;
 if(objectUrl)URL.revokeObjectURL(objectUrl);
 objectUrl=URL.createObjectURL(file);
 loadImage(objectUrl,file.name);
});
fetch('./fotos/lista.json').then(r=>{if(!r.ok)throw new Error('sin lista');return r.json()}).then(files=>{
 if(!Array.isArray(files)||!files.length){galleryPanel.classList.add('visible');galleryGrid.innerHTML='<div class="emptyGallery">Todavía no hay fotos. Sube JPG/JPEG a la carpeta fotos y añade sus nombres en fotos/lista.json.</div>';return;}
 gallery.hidden=false;galleryPanel.classList.add('visible');
 gallery.innerHTML='<option value="">Elegir foto guardada…</option>';
 files.forEach(file=>{
  const option=document.createElement('option');option.value=file;option.textContent=file.split('/').pop();gallery.appendChild(option);
  const card=document.createElement('button');card.className='photoCard';card.type='button';
  const img=document.createElement('img');img.src='./fotos/'+file;img.alt=file.split('/').pop();img.loading='lazy';
  const caption=document.createElement('span');caption.textContent=file.split('/').pop();
  card.append(img,caption);card.addEventListener('click',()=>loadImage('./fotos/'+file,file.split('/').pop()));galleryGrid.appendChild(card);
 });
}).catch(()=>{});
gallery.addEventListener('change',()=>{
 if(gallery.value)loadImage('./fotos/'+gallery.value,gallery.value.split('/').pop());
});
init();
</script>
</body>
</html>
